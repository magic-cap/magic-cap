name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    - uses: actions/checkout@v4
    - name: audit
      run: cargo audit

  code-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: rustfmt
      run: |
        rustfmt --verbose --check magic_cap/src/*.rs
        rustfmt --verbose --check mcap/src/*.rs
    - name: clippy
      run: cargo clippy

  tests:
    runs-on: ubuntu-latest
    needs: code-checks
    steps:
    - uses: actions/checkout@v4
    - name: Run mcap Tests
      run: cargo test --package magic_cap_cli
    - name: Run magic_cap Tests
      run: cargo test --package magic_cap

  coverage:
    runs-on: ubuntu-latest
    needs: code-checks
    steps:
    - uses: actions/checkout@v4
    - name: Install llvm-cov
      run: cargo install cargo-llvm-cov
    - name: Run llvm-cov
      run: cargo llvm-cov
