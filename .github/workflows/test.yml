name: Rust

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
      # v4.2.2: 11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: audit
      run: cargo audit

  code-checks:
    name: linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: rustfmt
      run: |
        rustfmt --verbose --check magic_cap/src/*.rs
        rustfmt --verbose --check mcap/src/*.rs
    - name: clippy
      run: cargo clippy

  tests:
    name: cargo test
    runs-on: ubuntu-latest
    needs: code-checks
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Run mcap Tests
      run: cargo test --package magic_cap_cli
    - name: Run magic_cap Tests
      run: cargo test --package magic_cap

  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    needs: code-checks
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Install llvm-cov
      run: cargo install cargo-llvm-cov
    - name: Run llvm-cov
      run: cargo llvm-cov
