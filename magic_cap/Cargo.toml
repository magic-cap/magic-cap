[package]
name = "magic_cap"
version = "0.0.0"
edition = "2024"
authors = [
    "meejah <meejah@meejah.ca>",
    "shapr <shae@ScannedInAvian.com>",
]
license = "AGPL-3.0-or-later"
description = "Magic Cap is a user-friendly tool for encrypted files."
##documentation = ""
homepage = "https://github.com/magic-cap"
repository = "https://github.com/magic-cap/magic-cap"
readme = "../README.org"
keywords = ["crypto", "cryptography", "cli", "security"]
categories = ["cryptography", "command-line-utilities", "data-structures", "encoding", "security"]
publish = true  # when flipping this, ensure GitHub repo is public (add homepage etc too if avail)

[lints.rust]
unsafe_code = "forbid"

[dependencies]
aes = "0.8.4"
anyhow = "1.0.99"
cipher = "0.4.4"
ctr = "0.9.2"
data-encoding = "2.9.0"
getrandom = { version = "0.3.3", features = ["std"] }
rmp-serde = "1.3.0"
rs_merkle = "1.5.0"
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
tempdir = "0.3.7"
thiserror = "2.0.17"
tempfile = "3.2"

[build-dependencies]
cargo-llvm-cov = "0.6.21"

[dev-dependencies]
proptest = "1.7.0"
tempfile = "3.2"

[package.metadata.cargo-udeps.ignore]
normal = ["tempdir","proptest"]

[profile.release]
opt-level = 3
